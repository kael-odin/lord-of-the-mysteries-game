<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 150" width="100%" role="img" aria-label="十一章剧情脉络：苏醒、值夜者、安提哥努斯之影、钟楼失踪案、绯红假面舞会、贝克兰德的雾、大雾霾、灰雾之上·塔罗会、海上之城、北陆·霜砚镇、南港归潮">
  <title>十一章剧情脉络</title>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a86a" stop-opacity="0"/>
      <stop offset="0.05" stop-color="#c9a86a" stop-opacity="0.7"/>
      <stop offset="0.95" stop-color="#c9a86a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#c9a86a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1300" height="150" fill="#0a0b12"/>

  <!-- connecting ember line -->
  <rect x="60" y="74" width="1180" height="1.5" fill="url(#line)"/>

  <!-- eleven chapter nodes -->
  <g font-family="Georgia, 'Times New Roman', serif" text-rendering="geometricPrecision">
    <!-- 1 -->
    <circle cx="100" cy="75" r="8" fill="#0a0b12" stroke="#c9a86a" stroke-width="1.5"/>
    <text x="100" y="44" text-anchor="middle" font-size="10" letter-spacing="2" fill="#7a7f90">第 一 章</text>
    <text x="100" y="108" text-anchor="middle" font-size="15" fill="#e7d9b8">苏 醒</text>
    <text x="100" y="128" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#6a6f80">水仙花街·清晨</text>
    <!-- 2 -->
    <circle cx="215" cy="75" r="8" fill="#0a0b12" stroke="#c9a86a" stroke-width="1.5"/>
    <text x="215" y="44" text-anchor="middle" font-size="10" letter-spacing="2" fill="#7a7f90">第 二 章</text>
    <text x="215" y="108" text-anchor="middle" font-size="15" fill="#e7d9b8">值 夜 者</text>
    <text x="215" y="128" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#6a6f80">黑荆棘公司</text>
    <!-- 3 -->
    <circle cx="330" cy="75" r="8" fill="#0a0b12" stroke="#c9a86a" stroke-width="1.5"/>
    <text x="330" y="44" text-anchor="middle" font-size="10" letter-spacing="2" fill="#7a7f90">第 三 章</text>
    <text x="330" y="108" text-anchor="middle" font-size="13" fill="#e7d9b8">安提哥努斯之影</text>
    <text x="330" y="128" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#6a6f80">密修会·笔记</text>
    <!-- 4 -->
    <circle cx="445" cy="75" r="8" fill="#0a0b12" stroke="#c9a86a" stroke-width="1.5"/>
    <text x="445" y="44" text-anchor="middle" font-size="10" letter-spacing="2" fill="#7a7f90">第 四 章</text>
    <text x="445" y="108" text-anchor="middle" font-size="15" fill="#e7d9b8">钟楼失踪案</text>
    <text x="445" y="128" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#6a6f80">钟绳·秘偶</text>
    <!-- 5 -->
    <circle cx="560" cy="75" r="8" fill="#0a0b12" stroke="#c9a86a" stroke-width="1.5"/>
    <text x="560" y="44" text-anchor="middle" font-size="10" letter-spacing="2" fill="#7a7f90">第 五 章</text>
    <text x="560" y="108" text-anchor="middle" font-size="15" fill="#e7d9b8">绯红假面舞会</text>
    <text x="560" y="128" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#6a6f80">残魂·抉择</text>
    <!-- 6 -->
    <circle cx="675" cy="75" r="9" fill="#0a0b12" stroke="#c9a86a" stroke-width="1.5"/>
    <text x="675" y="44" text-anchor="middle" font-size="10" letter-spacing="2" fill="#7a7f90">第 六 章</text>
    <text x="675" y="108" text-anchor="middle" font-size="15" fill="#e7d9b8">贝克兰德的雾</text>
    <text x="675" y="128" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#6a6f80">雾都·第二卷</text>
    <!-- 7 -->
    <circle cx="790" cy="75" r="9" fill="#0a0b12" stroke="#c9a86a" stroke-width="1.5"/>
    <text x="790" y="44" text-anchor="middle" font-size="10" letter-spacing="2" fill="#7a7f90">第 七 章</text>
    <text x="790" y="108" text-anchor="middle" font-size="16" fill="#e7d9b8">大 雾 霾</text>
    <text x="790" y="128" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#6a6f80">三日雾·根清</text>
    <!-- 8 -->
    <circle cx="905" cy="75" r="9" fill="#0a0b12" stroke="#c9a86a" stroke-width="1.5"/>
    <text x="905" y="44" text-anchor="middle" font-size="10" letter-spacing="2" fill="#7a7f90">第 八 章</text>
    <text x="905" y="108" text-anchor="middle" font-size="13" fill="#e7d9b8">灰雾之上·塔罗会</text>
    <text x="905" y="128" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#6a6f80">第二十三张椅子</text>
    <!-- 9 -->
    <circle cx="1020" cy="75" r="9" fill="#0a0b12" stroke="#c9a86a" stroke-width="1.5"/>
    <text x="1020" y="44" text-anchor="middle" font-size="10" letter-spacing="2" fill="#7a7f90">第 九 章</text>
    <text x="1020" y="108" text-anchor="middle" font-size="15" fill="#e7d9b8">海 上 之 城</text>
    <text x="1020" y="128" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#6a6f80">破潮者·两枚铜币</text>
    <!-- 10 -->
    <circle cx="1135" cy="75" r="9" fill="#0a0b12" stroke="#c9a86a" stroke-width="1.5"/>
    <text x="1135" y="44" text-anchor="middle" font-size="10" letter-spacing="2" fill="#7a7f90">第 十 章</text>
    <text x="1135" y="108" text-anchor="middle" font-size="13" fill="#e7d9b8">北陆·霜砚镇</text>
    <text x="1135" y="128" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#6a6f80">守名者·三枚铜币</text>
    <!-- 11 (current frontier) -->
    <circle cx="1230" cy="75" r="11" fill="#c9a86a" opacity="0.18"/>
    <circle cx="1230" cy="75" r="7" fill="#c9a86a"/>
    <text x="1230" y="44" text-anchor="middle" font-size="10" letter-spacing="2" fill="#c9a86a" opacity="0.9">第十一章 · 新</text>
    <text x="1230" y="108" text-anchor="middle" font-size="15" fill="#e7d9b8">南港归潮</text>
    <text x="1230" y="128" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#6a6f80">守向者·四枚铜币</text>
  </g>
</svg>
